[project]
name = "ai-business-workflow-automator-api"
version = "0.1.0"
description = "FastAPI backend for the AI Business Workflow Automator."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "asyncpg>=0.29",
    "pgvector>=0.3",                # type adapters; not used yet but cheap to include
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    # Migrations (Alembic depends on SQLAlchemy + a sync driver).
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    # Ingestion / scraping
    "selectolax>=0.3",     # fast HTML parsing (Modest engine, C-based)
    "tiktoken>=0.7",       # OpenAI token counting for budgeting prompts
    "openai>=1.50",        # gpt-4o-mini for research / qualify / personalize
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─── Ruff ────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC", "SIM"]
ignore = [
    "E501",   # line length -- formatter handles it
    "B008",   # FastAPI uses Depends() in defaults; that's fine
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Pytest ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
